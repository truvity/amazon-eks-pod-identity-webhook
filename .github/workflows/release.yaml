# Tag-triggered release — the shared implementation (INF-586: this repo
# was the last one bypassing it, with its own ko steps and a
# `curl | sh` devbox install).
#
# The caller grants the permissions because a reusable workflow can
# narrow them but never widen them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse
# than a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@7cff3700694ba492619ff3e0688341b91cd51a85 # v2.12.1
    with:
      charts: '["amazon-eks-pod-identity-webhook"]'
      # Nest the image under the repo namespace (INF-586 / INF-584 N1):
      # ko names the artifact after the cmd dir (cmd/webhook), so the
      # published slug is ghcr.io/truvity/amazon-eks-pod-identity-webhook/webhook.
      ko-docker-repo: ghcr.io/truvity/amazon-eks-pod-identity-webhook
