name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # The same recipe the shared workflow runs everywhere else, instead of
  # a hand-rolled copy that installed devbox through an UNPINNED
  # `curl | bash`. Deliberately not a required context.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@690acf2363bb57e0af99d62bfe88c894a8f68f0a # v5.9.0
    with:
      recipes: '["vuln"]'
