# Calls the shared workflow (truvity/ci-workflows), which runs each
# Justfile recipe as its OWN parallel job. Previously all of them ran
# serially inside one job, so a red result told you only that something
# failed — and this file was the LAST hand-rolled copy in the estate,
# still installing devbox through an unpinned `curl | bash`.
#
# Hosted runners: minutes are free on public repositories, so the
# fan-out costs nothing.
#
# Pinned by COMMIT SHA with a version comment. The SHA is what runs; the
# comment is what lets Renovate resolve it to a version and propose the
# next one. Without the comment the pin freezes silently, which is how
# eight repositories ended up several releases behind.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@6d7352b5fe172b46ae0fca37242f9ee91855f57e # v2.2.0
    with:
      # NOT `vuln`. It runs in security.yaml, which is not a required
      # context — a standard-library advisory with no released fix would
      # otherwise wedge every pull request on a finding nobody can act
      # on, which is exactly what happened to pulumi-zitadel.
      recipes: '["build","test","lint"]'

  # Stable name for branch protection: the matrix reports as
  # "recipes / build" and so on, so a required context called "check"
  # would never arrive and every PR would hang waiting for it.
  check:
    needs: recipes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All recipes passed
        run: |
          echo "recipes: ${{ needs.recipes.result }}"
          [ "${{ needs.recipes.result }}" = "success" ]
